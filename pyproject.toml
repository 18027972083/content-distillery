[project]
name = "content-distillery"
version = "0.2.0"
description = "Turn images, scanned books and videos into text, then ask questions over them (RAG)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyMuPDF>=1.24",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5", "numpy>=1.26"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
